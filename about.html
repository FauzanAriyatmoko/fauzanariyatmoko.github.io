<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About Fauzan Ariyatmoko | AI & Computer Vision Engineer">
    <title>About | Fauzan Ariyatmoko</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .about-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 60px;
            margin-top: 40px;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-subtle);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .tech-stack-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .tech-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .tech-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 170, 255, 0.1);
        }

        .tech-card h3 {
            color: var(--accent-primary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
        }

        .skill-tag {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .experience-item {
            margin-bottom: 32px;
            border-left: 2px solid var(--border-subtle);
            padding-left: 24px;
            position: relative;
        }

        .experience-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-primary);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .item-period {
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-family: var(--font-mono);
        }

        @media (max-width: 992px) {
            .about-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="font-mono text-accent" style="font-weight: 700; font-size: 1.2rem;">FA</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link active">About</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="certificates.html" class="nav-link">Certificates</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 60px; padding-bottom: 100px;">
        <h1 class="section-title">About <span class="text-accent">Me</span></h1>
        
        <div class="about-grid">
            <div class="about-content">
                <p id="bio-text" style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 40px;"></p>
                
                <h2 class="section-title">Technical <span class="text-accent">Interests</span></h2>
                <div id="interests-list" class="skill-list" style="margin-bottom: 40px;"></div>

                <h2 class="section-title">Experience</h2>
                <div id="experience-list"></div>

                <h2 class="section-title">Education</h2>
                <div id="education-list"></div>
            </div>
            
            <aside>
                <div style="background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); padding: 32px; position: sticky; top: 120px;">
                    <h3 style="margin-bottom: 20px;">Details</h3>
                    <div style="margin-bottom: 16px;">
                        <span class="text-secondary font-mono" style="font-size: 0.8rem; display: block; margin-bottom: 4px;">LOCATION</span>
                        <span id="profile-location"></span>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <span class="text-secondary font-mono" style="font-size: 0.8rem; display: block; margin-bottom: 4px;">CURRENT STATUS</span>
                        <span>Building intelligent systems...</span>
                    </div>
                    <a href="assets/documents/cv.pdf" class="btn btn-primary" style="width: 100%; margin-top: 20px;" target="_blank">Download CV</a>
                </div>
            </aside>
        </div>

        <h2 class="section-title" style="margin-top: 80px;">Technical <span class="text-accent">Skills</span></h2>
        <div id="tech-stack" class="tech-stack-grid"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Fauzan Ariyatmoko</p>
        </div>
    </footer>

    <script type="module">
        import { profile } from './data/profile.js';
        import { element } from './js/utils.js';

        // Populate basic info
        document.getElementById('bio-text').textContent = profile.biography;
        document.getElementById('profile-location').textContent = profile.location;

        // Populate interests
        const interestsList = document.getElementById('interests-list');
        profile.interests.forEach(interest => {
            interestsList.appendChild(element('span', 'skill-tag', interest));
        });

        // Populate tech stack
        const techStackGrid = document.getElementById('tech-stack');
        profile.techStack.forEach(category => {
            const card = element('div', 'tech-card');
            card.appendChild(element('h3', '', category.category));
            const list = element('div', 'skill-list');
            category.skills.forEach(skill => {
                list.appendChild(element('span', 'skill-tag', skill));
            });
            card.appendChild(list);
            techStackGrid.appendChild(card);
        });

        // Populate experience
        const expList = document.getElementById('experience-list');
        profile.experience.forEach(exp => {
            const item = element('div', 'experience-item');
            const header = element('div', 'item-header');
            header.appendChild(element('h3', '', exp.role));
            header.appendChild(element('span', 'item-period', exp.period));
            item.appendChild(header);
            item.appendChild(element('p', 'text-accent font-mono', exp.company));
            item.appendChild(element('p', '', exp.description));
            expList.appendChild(item);
        });

        // Populate education
        const eduList = document.getElementById('education-list');
        profile.education.forEach(edu => {
            const item = element('div', 'experience-item');
            const header = element('div', 'item-header');
            header.appendChild(element('h3', '', edu.degree));
            header.appendChild(element('span', 'item-period', edu.period));
            item.appendChild(header);
            item.appendChild(element('p', 'text-accent font-mono', edu.institution));
            eduList.appendChild(item);
        });
    </script>
</body>
</html>
